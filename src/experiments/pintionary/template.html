<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pintionary</title>
  <link rel="stylesheet" href="style.css">
  <!-- KaTeX for LaTeX support -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Pintionary</h1>
      <input type="text" id="searchBar" placeholder="Search entries...">
    </header>
    <main id="dictionary">
      {{#entries}}
      <article class="entry" id="{{key}}">
        <div class="entry-header">
          <h2>
            <a href="#{{key}}" class="hash-link" aria-hidden="true">#</a>
            <a href="#{{key}}" class="title-link">{{key}}</a>
          </h2>
          <button class="copy-btn" data-key="{{key}}" title="Copy to clipboard" aria-label="Copy to clipboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        {{{definition}}}
      </article>
      {{/entries}}
    </main>
  </div>

  <div id="disambiguation-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Disambiguation</h3>
      <p>The term "<strong id="dis-term"></strong>" can refer to multiple entries:</p>
      <ul id="dis-list"></ul>
      <button id="dis-close" class="close-btn">Close</button>
    </div>
  </div>

  <script>
    const searchBar = document.getElementById("searchBar");
    const entries = document.querySelectorAll(".entry");
    
    // Store original HTML to restore it when search changes
    const originalContent = new Map();
    entries.forEach(entry => {
      originalContent.set(entry, entry.innerHTML);
    });

    function highlightText(element, term) {
      if (!term) return;
      
      const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      while(walk.nextNode()) nodes.push(walk.currentNode);
      
      const regex = new RegExp(`(${term})`, "gi");
      
      nodes.forEach(node => {
        if (node.parentNode.classList.contains("highlight")) return;
        const text = node.textContent;
        if (regex.test(text)) {
          const span = document.createElement("span");
          span.innerHTML = text.replace(regex, '<mark class="highlight">$1</mark>');
          node.parentNode.replaceChild(span, node);
        }
      });
    }

    // Search functionality
    searchBar.addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase();
      
      entries.forEach(entry => {
        // Restore original content first
        entry.innerHTML = originalContent.get(entry);
        
        const titleText = entry.querySelector("h2").textContent.toLowerCase();
        const contentArea = entry.cloneNode(true);
        const header = contentArea.querySelector(".entry-header");
        if (header) header.remove();
        const defText = contentArea.textContent.toLowerCase();

        if (titleText.includes(term) || defText.includes(term)) {
          entry.style.display = "block";
          if (term) {
            highlightText(entry, term);
          }
          // Re-render LaTeX for visible entries
          if (window.renderMathInElement) {
            renderMathInElement(entry, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ]
            });
          }
        } else {
          entry.style.display = "none";
        }
      });
      
      // Re-bind buttons and links as they were replaced by innerHTML restore
      bindCopyButtons();
      bindDisambiguateLinks();
    });

    function bindCopyButtons() {
      document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-key");
          const entry = btn.closest(".entry");
          const title = entry.querySelector(".title-link").textContent;
          
          const definitionElement = entry.cloneNode(true);
          const header = definitionElement.querySelector(".entry-header");
          if (header) header.remove();
          const content = definitionElement.textContent.trim();
          
          const textToCopy = `${title}: ${content}`;
          
          navigator.clipboard.writeText(textToCopy).then(() => {
            btn.classList.add("copied");
            const originalTitle = btn.title;
            btn.title = "Copied!";
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.title = originalTitle;
            }, 2000);
          });
        });
      });
    }

    // Initial binding
    bindCopyButtons();
    bindDisambiguateLinks();

    function bindDisambiguateLinks() {
      document.querySelectorAll(".disambiguate").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const targets = link.getAttribute("data-targets").split(",");
          const term = link.textContent;
          const modal = document.getElementById("disambiguation-modal");
          const termSpan = document.getElementById("dis-term");
          const list = document.getElementById("dis-list");
          
          termSpan.textContent = term;
          list.innerHTML = "";
          
          targets.forEach(target => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "#" + target;
            a.textContent = target;
            a.classList.add("dict-link");
            a.addEventListener("click", () => {
              modal.classList.add("hidden");
            });
            li.appendChild(a);
            list.appendChild(li);
          });
          
          modal.classList.remove("hidden");
        });
      });
    }

    const modal = document.getElementById("disambiguation-modal");
    document.getElementById("dis-close").addEventListener("click", () => {
      modal.classList.add("hidden");
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
