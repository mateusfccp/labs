Eren:
  properNoun: true
  content: |
    An unambigous expression for Shrubby's house.

    It came to be because the expression "mi casa" is ambiguous, as we can't know if it refers
    to the utterer's house or to the hearer's house. Considering that "mi casa" is one of Attack
    on Titan's characters, we chose Eren to refer unambiguously to Shrubby's house.
Kurapika:
  properNoun: true
  content: |
    An unambigous expression for Pinto's house.

    It came to be because the expression "mi casa" is ambiguous, as we can't know if it refers
    to the utterer's house or to the hearer's house. Considering that "mi casa" is one of Attack
    on Titan's characters, we chose Kurapika (a.k.a Armin) to refer unambiguously to Pinto's house.
